<!DOCTYPE html>

<body class="auth-body">
    <div class="auth-container">
        <h2>স্বাগতম BdWin123-এ</h2>

            <button type="submit" class="btn btn-primary">লগইন করুন</button>
        </form>
        
        <div class="auth-links">
            <a href="refer.html">রেফার বোনাস প্রোগ্রাম দেখুন →</a>
        </div>
    </div>
