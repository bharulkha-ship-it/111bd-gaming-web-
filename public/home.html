<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোম - BdWin123</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">BdWin123</div>
        <div class="user-balance">ব্যালেন্স: <span id="balance">৳ ০.০০</span></div>
    </header>

    <main class="dashboard">
        <section class="welcome-banner">
            <h3>হ্যালো, স্বাগতম!</h3>
            <p>আপনার অ্যাকাউন্ট সফলভাবে সংযুক্ত হয়েছে। নিচের অপশনগুলো থেকে আপনার প্রয়োজনীয় সেবা বেছে নিন।</p>
        </section>

        <div class="action-grid">
            <a href="deposit.html" class="card-btn">
                <span class="icon">➕</span>
                <h4>ডিপোজিট করুন</h4>
            </a>
            <a href="withdraw.html" class="card-btn">
                <span class="icon">➖</span>
                <h4>উইথড্র করুন</h4>
            </a>
            <a href="refer.html" class="card-btn">
                <span class="icon">👥</span>
                <h4>রেফার বোনাস</h4>
            </a>
        </div>
    </main>
</body>
</html>
